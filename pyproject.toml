[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "unisim"

[project]
name = "unisim-core"
version = "1.2.0"
description = "Unified physics backend contracts and adapters"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "UniSim Authors" }]
requires-python = ">=3.10,<3.14"
dependencies = ["numpy"]
keywords = ["physics", "simulation", "robotics", "benchmark"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
# MuJoCo 3.11 alignment (unilabsim/UniLab#1515): the mujoco, mjwarp, and
# newton extras share one MuJoCo 3.11 / MuJoCo-Warp 3.11 / warp-lang 1.16.0
# line and are jointly installable. The `mujoco` bound is a compatible-release
# specifier; `uv.lock` pins the exact MuJoCo version. The executor is the
# unilabsim mjbatch fork (unilabsim/unisim#58), pinned as a git direct
# reference because its native per-substep callback, yaw hfield sampling, and
# cpu-affinity patches are not on any released wheel. The final
# distribution identity (PyPI fork name vs private index) is a roadmap open
# item (Motphys/UniLab#1552); a git direct reference cannot ship on PyPI, so
# the `mujoco` extra stays non-redistributable until that decision lands.
mujoco = ["mujoco~=3.11.0", "mjbatch @ git+https://github.com/unilabsim/mjbatch.git@cf4a83d8526f2fe6dd4847c25e05c34e81f6f91f"]
motrix = ["motrixsim-core==0.8.2"]
drake = ["drake-uni==0.1.0"]
mjwarp = ["mujoco-warp~=3.11.0", "warp-lang==1.16.0"]
genesis = ["genesis-world==1.3.3"]
# The superdex-uni wheels are a temporary unilabsim build carrying the native
# batch executor (CPython 3.12 and 3.13 ABIs) until the upstream
# project_superdex PR merges; switch back to superdex-physics/-robotics then.
# Other Python versions retain the NumPy-only base and fail with a targeted
# dependency diagnostic if this adapter is requested.
superdex = [
    "superdex-physics-uni==1.0.0 ; python_version >= '3.12' and python_version < '3.14'",
    "superdex-robotics-uni==1.0.0 ; python_version >= '3.12' and python_version < '3.14'",
    "mujoco~=3.11.0 ; python_version >= '3.12' and python_version < '3.14'",
]
# Newton's upstream coupling is precise, so these stay exact pins. They sit on
# the same 3.11 line as the extras above: newton 1.5.1 requires
# warp-lang>=1.16.0, and mujoco-warp 3.11.0 accepts warp-lang>=1.14 and
# mujoco>=3.9, so warp-lang==1.16.0 satisfies both.
newton = [
    "newton==1.5.1",
    "mujoco-warp==3.11.0",
    "mujoco==3.11.0",
    "warp-lang==1.16.0",
    # Newton's native ViewerGL is the default renderer for both playback
    # recording and interactive evaluation, so its GUI stack is part of the
    # backend extra rather than a separately-selected extra.
    "pyglet>=2.1.6,<3",
    "imgui-bundle>=1.92.0",
]
# Isaac SDKs are vendor-managed and cannot be represented as redistributable
# PyPI dependencies.  These empty extras provide a stable installation and
# support-matrix spelling while runtime discovery uses dedicated workers.
isaacgym = []
isaacsim = []

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
