[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "unisim"

[tool.uv]
# The MuJoCo-related extras are split across two version lines that cannot
# coexist in one environment. The `mujoco` (mjbatch_uni 0.3.1), `mjwarp`, and
# `scene-compiler` extras track the MuJoCo 4.0.1 line (`mujoco~=4.0.1` /
# `mujoco-warp~=4.0.1`; MuJoCo core 4.0.1 ships as the `mujoco-core`
# distribution, and the `mujoco` meta-distribution and `mujoco-core` both
# provide the `mujoco` import package). The `newton` extra pins
# mujoco-warp==3.11.0 and mujoco==3.11.0, and `superdex` keeps mujoco~=3.11.0
# as its cold-path parser, so both stay on the MuJoCo 3.11 line. Keep every
# extra available while making the resolver fail with an explicit, actionable
# conflict when cross-line extras are selected together. Drop the newton and
# superdex conflicts once those extras move to the 4.0 line.
conflicts = [
    [{ extra = "mjwarp" }, { extra = "newton" }],
    [{ extra = "mujoco" }, { extra = "newton" }],
    [{ extra = "scene-compiler" }, { extra = "newton" }],
    [{ extra = "mjwarp" }, { extra = "superdex" }],
    [{ extra = "mujoco" }, { extra = "superdex" }],
    [{ extra = "scene-compiler" }, { extra = "superdex" }],
]

[project]
name = "unisim-core"
version = "2.8.6"
description = "Unified physics backend contracts and adapters"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "UniSim Authors" }]
requires-python = ">=3.10,<3.14"
dependencies = ["numpy"]
keywords = ["physics", "simulation", "robotics", "benchmark"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
# Portable MJCF scene compilation uses the public MuJoCo parser/compiler only;
# it intentionally does not require the mjbatch native executor. It shares the
# `mujoco` import package with the `mujoco` and `mjwarp` extras, so all three
# track the MuJoCo 4.0.1 line and stay jointly installable; the MuJoCo 4.0
# line requires Python >=3.11.
scene-compiler = ["mujoco~=4.0.1 ; python_version >= '3.11'"]
# MuJoCo 4.0.1 alignment: the `mujoco`, `mjwarp`, and `scene-compiler` extras
# share one MuJoCo 4.0.1 / MuJoCo-Warp 4.0.1 line with a warp-lang >=1.15 floor
# (MuJoCo core ships as the `mujoco-core` distribution; the `mujoco`
# meta-distribution pins it exactly) and are jointly installable. The bounds
# are compatible-release specifiers; `uv.lock` pins the exact versions. The
# executor is the unilabsim mjbatch fork (https://github.com/unilabsim/mjbatch_uni)
# at its 0.3.1 MuJoCo 4.0.1-aligned release; the per-env model-field,
# VariantPack, split-substep sensor-copyout, and selective sensor-refresh APIs
# from the 0.2.2+ line remain available. The MuJoCo 4.0 line requires Python
# >=3.11, so the extra contributes nothing on 3.10 and the adapter fails
# closed with its dependency diagnostic.
mujoco = [
    "mujoco~=4.0.1 ; python_version >= '3.11'",
    "mjbatch-uni==0.3.1 ; python_version >= '3.11'",
]
motrix = ["motrixsim-core==1.0.0"]
# The adapter currently supports the Linux x86-64 CUDA profile.
motrix-gpu = [
    "motrixsim-core==1.0.0",
    "motrixsim-gpu==1.0.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
drake = ["drake-uni==0.2.0"]
# The mjwarp extra tracks the MuJoCo-Warp 4.0.1 line (MuJoCo core 4.0.1 via
# the `mujoco-core` distribution) and is jointly installable with the
# `mujoco` and `scene-compiler` extras on the same 4.0.1 line. warp-lang>=1.15
# matches mujoco-warp 4.0.1's own upstream requirement and lets the extra share
# an environment with Motrix GPU (motrixsim-gpu 1.0.0 resolves warp-lang
# 1.17.0, which satisfies this floor). The MuJoCo 4.0 line requires Python
# >=3.11; on 3.10 the extra contributes only warp-lang and the backend fails
# closed with its dependency diagnostic (the superdex pattern).
mjwarp = [
    "mujoco-warp~=4.0.1 ; python_version >= '3.11'",
    "warp-lang>=1.15",
]
genesis = ["genesis-world==1.3.3"]
# The superdex-uni wheels are a temporary unilabsim build carrying the native
# batch executor (CPython 3.12 and 3.13 ABIs) until the upstream
# project_superdex PR merges; switch back to superdex-physics/-robotics then.
# Other Python versions retain the NumPy-only base and fail with a targeted
# dependency diagnostic if this adapter is requested. SuperDex keeps MuJoCo
# 3.11 as its cold-path MJCF parser, so it stays on the 3.11 line and is a
# declared conflict with the 4.0.1-line extras above.
superdex = [
    "superdex-physics-uni==1.3.0 ; python_version >= '3.12' and python_version < '3.14'",
    "superdex-robotics-uni==1.3.0 ; python_version >= '3.12' and python_version < '3.14'",
    "mujoco~=3.11.0 ; python_version >= '3.12' and python_version < '3.14'",
]
# Newton's upstream coupling is precise, so these stay exact pins. It sits on
# the MuJoCo 3.11 line alone (newton 1.5.1 requires warp-lang>=1.16.0, and
# mujoco-warp 3.11.0 accepts warp-lang>=1.14 and mujoco>=3.9, so
# warp-lang==1.17.0 satisfies both) and is a declared conflict with the
# 4.0.1-line extras above.
newton = [
    "newton==1.5.1",
    "mujoco-warp==3.11.0",
    "mujoco==3.11.0",
    "warp-lang==1.17.0",
    # Newton's native ViewerGL is the default renderer for both playback
    # recording and interactive evaluation, so its GUI stack is part of the
    # backend extra rather than a separately-selected extra.
    "pyglet>=2.1.6,<3",
    "imgui-bundle>=1.92.0",
]
newton-viser = ["viser>=1.1,<2"]
# The interactive playback primitives in `unisim.visualization` are NumPy-only
# and duck-type the Viser GUI surface: they import without Viser, so the base
# wheel stays NumPy-only.  The `viz` extra only installs Viser for viewers that
# host a real ViserServer.  Its range is the intersection accepted by UniLab
# (`viser>=1.0.26`) and the downstream h2r_bench (`viser>=1.1.1,<2`), so
# co-installation resolves without a dependency conflict.
viz = ["viser>=1.1.1,<2"]
# Isaac SDKs are vendor-managed and cannot be represented as redistributable
# PyPI dependencies.  These empty extras provide a stable installation and
# support-matrix spelling while runtime discovery uses dedicated workers.
isaacgym = []
isaacsim = []

[dependency-groups]
# pyright is pinned to match the sister unilab-rl repository so both projects
# type-check with the same analyzer behavior.
dev = ["pytest", "ruff", "mypy", "pyright==1.1.408"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

# mypy is configured exactly like the sister unilab-rl repository:
# no_site_packages + ignore_missing_imports mean site-package stubs (NumPy
# included) are never parsed, so the 3.10 target does not trip over the
# locked NumPy stubs' 3.12 ``type`` statement, and the optional engine SDKs
# (which ship no stubs or py.typed marker, or are not pip-installable at all)
# need no per-module exemptions.  pyright below keeps NumPy fully typed.
[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_site_packages = true

# pyright lives in pyproject.toml (rather than pyrightconfig.json) so all tool
# configuration stays in one file, matching the unilab-rl setup.
[tool.pyright]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
include = ["src/unisim"]
# Optional engine SDKs are extras (see the mypy note above); unresolved
# optional-runtime imports are warnings, first-party type errors stay errors.
reportMissingImports = "warning"
reportMissingModuleSource = "none"
# Unlike unilab-rl (whose checked deps are typed), unisim imports mujoco and
# other SDKs that ship no py.typed marker; without this, pyright infers types
# from their sources and reports hundreds of false attribute errors.  NumPy
# carries py.typed and stays fully checked.
useLibraryCodeForTypes = false
