[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "unisim"

[tool.uv]
# The Newton/MuJoCo-Warp 3.11 line cannot coexist with the historical MJWarp
# 3.10.0.3 line in one environment. Keep both extras available while making
# the resolver fail with an explicit, actionable conflict when selected
# together.
conflicts = [
    [{ extra = "mjwarp" }, { extra = "newton" }],
    [{ extra = "mujoco" }, { extra = "newton" }],
]

[project]
name = "unisim-core"
version = "1.1.0"
description = "Unified physics backend contracts and adapters"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "UniSim Authors" }]
requires-python = ">=3.10,<3.14"
dependencies = ["numpy"]
keywords = ["physics", "simulation", "robotics", "benchmark"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
mujoco = ["mujoco>=3.5", "mujoco-uni-runtime==0.4.0"]
motrix = ["motrixsim-core==0.8.2"]
drake = ["drake-uni==0.1.0"]
mjwarp = ["mujoco-warp==3.10.0.3", "warp-lang>=1.14.0"]
genesis = ["genesis-world==1.3.3"]
# Newton 1.5.1's MuJoCo solver line is intentionally isolated from the
# historical mjwarp extra above: Newton's sim extra requires the 3.11 line,
# while mjwarp remains pinned to 3.10.0.3. Do not install both extras in one
# environment.
newton = [
    "newton==1.5.1",
    "mujoco-warp==3.11.0",
    "mujoco==3.11.0",
    "warp-lang==1.16.0",
]
# GUI dependencies for Newton's native ViewerGL playback (record and
# interactive).  Kept out of the ``newton`` extra so pure training
# environments stay headless-clean; install as
# `uv sync --extra newton --extra newton-render`.  Mirrors the floors Newton
# itself pins under its ``examples`` extra.
newton-render = [
    "pyglet>=2.1.6,<3",
    "imgui-bundle>=1.92.0",
]
# Isaac SDKs are vendor-managed and cannot be represented as redistributable
# PyPI dependencies.  These empty extras provide a stable installation and
# support-matrix spelling while runtime discovery uses dedicated workers.
isaacgym = []
isaacsim = []

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
