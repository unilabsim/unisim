name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The MuJoCo 4.0 line (mujoco/mjbatch/mujoco-warp extras) requires
        # Python >=3.11; the test jobs install the mujoco adapter extra.
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
      - name: Install locked core environment
        run: uv sync --locked
      # The complete suite exercises the mjbatch-backed MuJoCo adapter, whose
      # native Windows profile is not CI-validated yet (mjbatch 0.3.3 ships
      # Windows wheels, so enabling it is possible follow-up); the mujoco
      # extra and the complete suite stay off the Windows job, which runs the
      # core/import-boundary subset against the pure-Python core.
      - name: Install MuJoCo adapter test extra
        if: runner.os != 'Windows'
        run: uv sync --locked --extra mujoco
      - name: Lint
        run: uv run ruff check .
      - name: Test complete suite
        if: runner.os != 'Windows'
        run: uv run pytest -q
      - name: Test core suite on Windows
        if: runner.os == 'Windows'
        run: >-
          uv run pytest -q tests/contract/test_backend.py
          tests/core/test_import_boundary.py::test_import_does_not_pull_unilab_or_engine_modules
          tests/core/test_package_boundary.py tests/core/test_repository_layout.py
          tests/adapters/mjwarp/test_contract.py

  typecheck:
    name: Type check (mypy + pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Python 3.11 matches the unilab-rl typecheck job; mypy runs with
          # no_site_packages, so the interpreter's bundled stubs never matter.
          python-version: "3.11"
      - name: Install locked core environment
        run: uv sync --locked --extra mujoco
      - name: mypy
        run: uv run mypy src/unisim
      - name: pyright
        run: uv run pyright

  package:
    name: Build release distributions (pre-release)
    needs: [check, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: false
      - name: Build source distribution and universal wheel
        run: uv build --sdist --wheel --out-dir dist
      - name: Check distribution metadata
        run: uvx --from twine twine check dist/*
      - name: Install the freshly built source distribution
        run: |
          uv venv .package-venv
          uv pip install --python .package-venv/bin/python numpy
          uv pip install --python .package-venv/bin/python --reinstall --no-deps \
          --no-binary unisim-core --no-cache --find-links dist --no-index unisim-core
      - name: Smoke test installed source distribution
        run: >-
          .package-venv/bin/python -c "import unisim;
          backend = unisim.create_backend('fake', num_envs=1, num_actuators=1);
          assert backend.get_keyframe_qpos('home').shape == (1,);
          assert not hasattr(backend, 'step')"
      - name: Install the freshly built wheel only (no sdist fallback)
        run: >-
          uv pip install --python .package-venv/bin/python --reinstall --no-deps
          --only-binary :all: --no-cache --find-links dist --no-index unisim-core
      - name: Smoke test installed wheel
        run: >-
          .package-venv/bin/python -c "import unisim;
          backend = unisim.create_backend('fake', num_envs=1, num_actuators=1);
          assert backend.get_keyframe_qpos('home').shape == (1,);
          assert not hasattr(backend, 'step')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-dists
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error
