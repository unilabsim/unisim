name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-sdist:
    name: Build and verify source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: false
      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          project_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$tag_version" = "$project_version" || {
            echo "Tag v$tag_version does not match pyproject.toml version $project_version" >&2
            exit 1
          }
      - name: Verify CI passed for tagged commit
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          successful_runs="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          test "$successful_runs" -gt 0 || {
            echo "No successful ci.yml run found for tagged commit $GITHUB_SHA" >&2
            echo "Wait for CI to pass before creating the release tag." >&2
            exit 1
          }
      - name: Install build and test tools
        run: |
          uv venv .release-venv
          uv pip install --python .release-venv/bin/python \
            "uv_build>=0.12.1,<0.13" numpy
      - name: Build source distribution
        run: uv build --sdist --out-dir dist
      - name: Check source distribution metadata
        run: uvx --from twine twine check dist/*
      - name: Install the freshly built source distribution
        run: >-
          uv pip install --python .release-venv/bin/python --reinstall --no-deps
          --no-binary unisim-core --no-cache --find-links dist --no-index unisim-core
      - name: Smoke test installed source distribution
        run: >-
          .release-venv/bin/python -c "import numpy as np; import unisim;
          backend = unisim.create_backend('fake', num_envs=2, num_actuators=1);
          backend.step(np.ones((2, 1)));
          assert backend.get_state(('qpos',))['qpos'].shape == (2, 1)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-sdist
          path: dist/*.tar.gz

  publish:
    needs: build-sdist
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: pypi
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-sdist
          path: dist
      - name: Publish source distribution to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@ec4db0b4ddc65acdf4bff5fa45ac92d78b56bdf0 # v1.9.0
        with:
          packages-dir: dist
          skip-existing: true
