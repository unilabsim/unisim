name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  MUJOCO_VERSION: "3.10.0"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Release check / ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
      - name: Install build and test tools
        run: >-
          uv pip install --system "uv_build>=0.12.1,<0.13" numpy pytest
          "mujoco==${{ env.MUJOCO_VERSION }}" "mujoco-uni-runtime==0.4.0"
          setuptools wheel
      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        shell: bash
        run: |
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$tag_version" = "$project_version" || {
            echo "Tag v$tag_version does not match pyproject.toml version $project_version" >&2
            exit 1
          }
      - name: Build wheel and source distribution
        run: uv build --out-dir dist
      - name: Install and test the freshly built source distribution
        run: >-
          uv pip install --system --reinstall --no-build-isolation --no-deps
          --no-binary unisim-core --no-cache --find-links dist --no-index unisim-core
      - name: Test installed source distribution
        run: python -m pytest tests/ -q
      - name: Install and test the freshly built wheel
        shell: bash
        run: |
          uv pip uninstall --system unisim-core
          uv pip install --system --reinstall --no-deps --only-binary unisim-core \
            --no-cache --find-links dist --no-index unisim-core
          python -m pytest tests/ -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          name: release-dist
          path: dist/

  publish:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: pypi
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@ec4db0b4ddc65acdf4bff5fa45ac92d78b56bdf0 # v1.9.0
        with:
          skip-existing: true
